name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  hygiene:
    # Runs the pre-commit hooks so they are enforced for contributors who
    # never ran `pre-commit install`. The two cargo hooks are skipped: fmt and
    # clippy already have dedicated steps in `check`, across three platforms,
    # and running them twice would only slow the pipeline down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: cargo-fmt,cargo-clippy

  deny:
    # Security advisories, license compatibility, banned/duplicate crates and
    # crate sources. Policy lives in deny.toml; run it locally with
    # `cargo deny check`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    # Pins to the workspace's declared rust-version so a dependency bump that
    # needs a newer compiler than 1.85 fails here instead of surfacing only
    # for a user on an older toolchain. One OS is enough: this job checks the
    # compiler version constraint, not platform behaviour.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check on MSRV
        run: cargo check --workspace --locked
