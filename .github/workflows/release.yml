name: Release

# Publishing is irreversible: crates.io does not allow a version to be deleted
# or replaced, only yanked -- and a yanked version is still downloadable by
# anything that already has it in a lock file. So every gate below runs before
# a single crate is uploaded, and the whole thing can be rehearsed end to end
# with `dry_run`.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify everything, upload nothing"
        type: boolean
        default: true

permissions:
  contents: write # Creating the GitHub release.

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag says one version and Cargo.toml says another is the mistake this
  # exists to catch, because it is silent: the release notes would say v0.2.0
  # while crates.io received 0.1.0, and neither can be taken back.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Tag and workspace version must agree
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "workspace version: $manifest"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag version:       $tag"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::tag v$tag does not match the workspace version $manifest"
              exit 1
            fi
          fi

  # The full CI set, re-run against the exact commit being released rather
  # than trusted from whenever it last ran on main. A release is the one place
  # where "it was green yesterday" is not good enough.
  verify:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  deny:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Builds each crate exactly as crates.io will receive it -- from the packaged
  # tarball, not the working tree. This is what catches a file the crate reads
  # but does not ship: `include_bytes!` reaching outside the crate root
  # packages cleanly and then fails to compile for whoever installs it.
  #
  # `bombadil-gui` and `bombadil` cannot be verified this way until the crates
  # they depend on exist on crates.io at the version being released, because
  # packaging resolves against the real index. `--no-verify` for those, with
  # `--list` proving the GUI's assets are in the tarball -- the half that would
  # otherwise go unchecked.
  package:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Package the library crates, building each from its tarball
        run: |
          cargo package -p bombadil-core --locked
          cargo package -p bombadil-uv-bin --locked
      - name: The GUI tarball must contain the files the binary embeds
        run: |
          set -euo pipefail
          files=$(cargo package -p bombadil-gui --locked --no-verify --list)
          echo "$files"
          for required in assets/icon-64.rgba assets/icon-macos.png fonts/IBMPlexMono-Regular.ttf; do
            if ! grep -qx "$required" <<<"$files"; then
              echo "::error::$required is embedded by the binary but missing from the package"
              exit 1
            fi
          done

  # One job, sequential, because the order is a dependency order: crates.io
  # rejects a crate whose dependencies it does not have yet. `cargo publish`
  # already waits for each upload to appear in the index before returning, so
  # the next one finds what it needs.
  publish:
    needs: [version, verify, deny, package]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    # The token lives on this environment, not on the repository, so nothing
    # outside a run that reaches this job can read it.
    environment: crates_deploy
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Publish, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Through the environment rather than interpolated into the script.
          # This one is read out of our own Cargo.toml so it is not attacker
          # controlled, but a `${{ }}` inside `run:` is textual substitution --
          # the habit is what keeps the next one, from a less trustworthy
          # source, from becoming a shell injection.
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for crate in bombadil-core bombadil-uv-bin bombadil-gui bombadil; do
            echo "::group::$crate"
            # An already-published version is not a failure worth stopping on:
            # it means an earlier attempt got this far, and the run should be
            # able to finish the crates that did not make it.
            if cargo publish -p "$crate" --locked; then
              echo "$crate published"
            elif cargo search "$crate" --limit 1 | grep -qF "$crate = \"$VERSION\""; then
              echo "$crate $VERSION was already on crates.io -- continuing"
            else
              echo "::error::publishing $crate failed"
              exit 1
            fi
            echo "::endgroup::"
          done


  # The same application, delivered where the people who need it already are:
  # `pip install bombadil`. The wheel carries the compiled binary and a console
  # entry point and contains no Python at all -- the route uv itself takes to
  # PyPI.
  #
  # One wheel per platform, because the payload is a native binary. The matrix
  # is bounded by `uv-manifest.toml`: `bombadil-uv-bin`'s build script refuses a
  # target it has no pinned uv checksum for, which is the behaviour that keeps
  # an unverified binary from ever being embedded.
  #
  # manylinux is achievable here only because the binary links nothing but
  # libc, libgcc and libm -- iced loads Wayland and X11 at runtime rather than
  # linking them. A GUI binary that linked them would need auditwheel to bundle
  # system libraries, which is a different and much worse problem.
  wheels:
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          # Apple Silicon only. No Intel Mac wheel is built -- `cargo install
          # bombadil` still works there, because `uv-manifest.toml` keeps its
          # pinned x86_64-apple-darwin checksum; it is the prebuilt wheel that
          # is dropped, not the platform.
          - { os: macos-latest, target: aarch64, manylinux: "off" }
          - { os: windows-latest, target: x64, manylinux: "off" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # Separate from `publish` on purpose: PyPI and crates.io are independent
  # registries with independent tokens, and a failure to reach one must not
  # leave the other half-done and unexplained.
  pypi:
    needs: [version, wheels, package, deny]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: crates_deploy
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - name: Upload to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_BOMBADIL }}
        run: |
          set -euo pipefail
          pipx install maturin || pip install maturin
          # `--skip-existing`, for the same reason `cargo publish` tolerates an
          # already-published crate: a re-run after a partial failure should be
          # able to finish rather than refuse from the first file.
          maturin upload --skip-existing dist/*.whl

  # Installable downloads attached to the GitHub release, for people who have
  # neither cargo nor pip: a .deb and an .rpm per Linux architecture, a
  # universal .dmg for macOS, a setup.exe for Windows, and the bare binary of
  # each in an archive. Every job installs what it built and starts the app
  # for a few seconds, so a package that cannot install or a binary that
  # crashes on launch fails here rather than on a user's machine.
  #
  # Linux builds on 22.04, not ubuntu-latest: a binary needs a glibc at least
  # as new as the one it was linked against, and 22.04's 2.35 still covers
  # Debian 12, Ubuntu 22.04 and RHEL 9.
  linux-packages:
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev xvfb
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release --locked -p bombadil
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo deb -p bombadil --no-build --output dist/
          cargo generate-rpm -p crates/bombadil --output dist/
          tar -C target/release -czf "dist/bombadil-$VERSION-$ARCH-linux.tar.gz" bombadil
          ls -la dist
      - name: The .deb installs and the app starts
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/*.deb
          test -f /usr/share/applications/bombadil.desktop
          # Still running when `timeout` stops it (124) means it got past startup.
          status=0
          xvfb-run -a timeout 10 /usr/bin/bombadil || status=$?
          test "$status" -eq 124
      - name: The .rpm installs
        run: docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest dnf install -y /dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # One universal .app: both architectures built here and joined with lipo, so
  # there is a single download whichever Mac it lands on. Ad-hoc signed only;
  # without a Developer ID and notarisation, macOS asks the user to confirm
  # the first launch (docs/install.md says how).
  macos-app:
    needs: [version, verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --locked -p bombadil --target aarch64-apple-darwin
          cargo build --release --locked -p bombadil --target x86_64-apple-darwin
      - name: Bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          app="$stage/Bombadil.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/bombadil" \
            target/aarch64-apple-darwin/release/bombadil \
            target/x86_64-apple-darwin/release/bombadil
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          iconset="$(mktemp -d)/bombadil.iconset"
          mkdir "$iconset"
          src=crates/bombadil-gui/assets/icon-macos.png
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$src" --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" "$src" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/bombadil.icns"
          codesign --force --deep --sign - "$app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Bombadil -srcfolder "$stage" -ov -format UDZO \
            "dist/bombadil-$VERSION-macos-universal.dmg"
          tar -C "$app/Contents/MacOS" -czf "dist/bombadil-$VERSION-macos-universal.tar.gz" bombadil
          ls -la dist
      - name: The .dmg mounts and the app starts
        run: |
          set -euo pipefail
          mount=$(mktemp -d)
          hdiutil attach dist/*.dmg -nobrowse -mountpoint "$mount"
          lipo -archs "$mount/Bombadil.app/Contents/MacOS/bombadil"
          "$mount/Bombadil.app/Contents/MacOS/bombadil" &
          pid=$!
          sleep 10
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: dist/*
          if-no-files-found: error

  windows-installer:
    needs: [version, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p bombadil
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\bombadil.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path target\release\bombadil.exe -DestinationPath "dist\bombadil-$env:VERSION-x86_64-windows.zip"
          Get-ChildItem dist
      - name: The installer installs and the app starts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Bombadil\bombadil.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "bombadil exited with $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, publish, pypi, linux-packages, macos-app, windows-installer]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A release for this tag very often exists already, because publishing
      # one from the GitHub UI is what creates the tag, and creating the tag is
      # what starts this run. Treating that as a failure marks a release red
      # after every crate has already been uploaded -- which is exactly what
      # happened to v0.1.0.
      #
      # An existing release is left completely alone. Its notes may have been
      # written by hand, and `gh release edit --notes` replaces the body rather
      # than appending to it: overwriting someone's release notes to add one
      # cosmetic line about crates.io is a bad trade.
      - name: Create the GitHub release, unless there already is one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "a release for $GITHUB_REF_NAME already exists -- leaving its notes untouched"
            echo "published to crates.io: bombadil, bombadil-gui, bombadil-core, bombadil-uv-bin $VERSION"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Bombadil $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Published to crates.io: \`bombadil\`, \`bombadil-gui\`, \`bombadil-core\`, \`bombadil-uv-bin\` $VERSION."
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      # `--clobber`, so a re-run replaces what an earlier attempt uploaded
      # instead of failing on the first file that is already there.
      - name: Attach the installers and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --clobber -- *
