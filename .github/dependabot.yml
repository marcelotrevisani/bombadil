version: 2

updates:
  # Cargo.lock is committed and CI runs with --locked, so nothing upgrades on
  # its own. Dependabot is what turns that pin from "frozen" into "reviewed".
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR per week rather than one per
      # crate. Major bumps stay separate: those are the ones that need a human
      # to read a changelog.
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
