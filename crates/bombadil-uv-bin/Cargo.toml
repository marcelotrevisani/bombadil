[package]
name = "bombadil-uv-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fetches and embeds a pinned uv binary at build time, for Bombadil."
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[build-dependencies]
flate2 = "1.1.9"
sha2.workspace = true
tar = "0.4.46"
toml.workspace = true
# `platform-verifier` so TLS trusts what the machine trusts. ureq's default is
# a compiled-in copy of Mozilla's roots, which never consults the OS store --
# see `download` in build.rs for why that broke real installs.
ureq = { version = "3.3.0", features = ["platform-verifier"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }
