# Hand-authored golden fixture exercising every field of `Config`.
#
# This file is NOT generated by serde. A generated fixture would just
# re-encode whatever bug is already in the serializer; this one is typed by
# hand against the field definitions in `src/model/*.rs` so that a field
# rename or shape change shows up as a real mismatch, not a tautology.
#
# Paired with the test `deserializes_the_golden_fixture_field_by_field` in
# `src/store/mod.rs`, which asserts the resulting `Config` equals an
# independently hand-built expected value.

schema_version = 2

[settings]
theme = "light"
close_to_tray = false

[settings.uv_source]
kind = "custom"
path = "/opt/uv/bin/uv"

[settings.default_venv_location]
kind = "central"
path = "/home/t/.venvs"

# Window and sidebar layout; every field may be missing.
[settings.layout]
sidebar_width = 300
sidebar_collapsed = true
window = [1280, 800]
tab_order = ["members", "deps"]

# The global interpreter pin. `unpinned` is the other shape, and is what a
# config written before this field existed loads as.
[settings.python]
kind = "version"
value = "3.12.13"

# A "default" index (maps to UV_DEFAULT_INDEX) with Basic auth.
[[indexes]]
name = "priv"
url = "https://nexus.corp/simple"
kind = "default"
default_for_new_projects = true

[indexes.auth]
type = "basic"
username = "alice"

# An "extra" index (maps to UV_INDEX) with no auth.
[[indexes]]
name = "extra"
url = "https://pypi.org/simple"
kind = "extra"
default_for_new_projects = false

[indexes.auth]
type = "none"

[[global_env]]
key = "HTTP_PROXY"
value = "http://proxy:8080"
secret = false

[[global_scripts]]
path = "/etc/bombadil/pre.sh"
args = ["--quiet"]
enabled = true

[[projects]]
id = "00000000-0000-0000-0000-000000000000"
label = "my-api"
pyproject_path = "/proj/my-api/pyproject.toml"
index_names = ["priv", "extra"]

# A project-level venv override, distinct from the global Central setting above.
# Two environments, because that is the shape version 2 exists to carry: a
# fixture with one could not catch a serialiser that only ever wrote the
# first. `active` names one of them by location -- never by index, since this
# list is edited while the application runs.
expanded = false

[[projects.environments]]

[projects.environments.location]
kind = "custom"
path = "/mnt/envs/my-api"

[projects.environments.python]
kind = "version"
value = "3.11"

[[projects.environments]]

[projects.environments.location]
kind = "alongside"

[projects.environments.python]
kind = "unpinned"

[projects.active]
kind = "alongside"

# A secret var: value must be empty on disk, the real value lives in the keychain.
[[projects.env]]
key = "DATABASE_PASSWORD"
value = ""
secret = true

[[projects.scripts]]
path = "./scripts/decrypt.sh"
args = []
enabled = false

[projects.members]
all_discovered = false

[[projects.members.entries]]
path = "packages/alpha"
origin = "discovered"
selected = true

[[projects.members.entries]]
path = "/work/shared-lib"
origin = "added"
selected = false
name = "shared-lib"

# Per-project overrides. `kind = "inherit"` is the other shape, and is what an
# absent field loads as -- which is what keeps a config written before these
# existed loading unchanged. The interpreter pin is NOT here in version 2: it
# lives on each environment above.
[projects.uv_source]
kind = "set"

[projects.uv_source.value]
kind = "from_path"

# Keyed by OS, mirroring [terminal_defaults]: the terminals that exist differ
# per platform, so an override for one must not speak for another.
[projects.terminals.linux]
kind = "detected"
value = "konsole"
