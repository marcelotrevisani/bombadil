[project]
name = "my-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx~=0.27",
]

[project.optional-dependencies]
cli = ["typer"]
postgres = ["asyncpg>=0.29", "sqlalchemy>=2"]

[dependency-groups]
test = ["pytest>=8", "pytest-cov"]
dev = [{ include-group = "test" }, "ruff"]

[tool.uv]
package = false
