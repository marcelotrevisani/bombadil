# A version-1 config, hand-authored, exactly as an older build wrote one.
#
# DO NOT "fix this up" to the current schema. Its whole job is to be old: it is
# the only thing standing between a migration bug and a user's account of where
# their packages are. A migration that loses an environment is found by the
# user at their next Sync, watching uv build a new one somewhere else.
#
# Version 1 held one environment per project in [projects.venv], with the
# interpreter pin on the project in [projects.python].
# Hand-authored golden fixture exercising every field of `Config`.
#
# This file is NOT generated by serde. A generated fixture would just
# re-encode whatever bug is already in the serializer; this one is typed by
# hand against the field definitions in `src/model/*.rs` so that a field
# rename or shape change shows up as a real mismatch, not a tautology.
#
# Paired with the test `deserializes_the_golden_fixture_field_by_field` in
# `src/store/mod.rs`, which asserts the resulting `Config` equals an
# independently hand-built expected value.

schema_version = 1

[settings.uv_source]
kind = "custom"
path = "/opt/uv/bin/uv"

[settings.default_venv_location]
kind = "central"
path = "/home/t/.venvs"

# The global interpreter pin. `unpinned` is the other shape, and is what a
# config written before this field existed loads as.
[[indexes]]
name = "priv"
url = "https://nexus.corp/simple"
kind = "default"
default_for_new_projects = true

[indexes.auth]
type = "basic"
username = "alice"

# An "extra" index (maps to UV_INDEX) with no auth.
[[indexes]]
name = "extra"
url = "https://pypi.org/simple"
kind = "extra"
default_for_new_projects = false

[indexes.auth]
type = "none"

[[global_env]]
key = "HTTP_PROXY"
value = "http://proxy:8080"
secret = false

[[global_scripts]]
path = "/etc/bombadil/pre.sh"
args = ["--quiet"]
enabled = true

[[projects]]
id = "00000000-0000-0000-0000-000000000000"
label = "my-api"
pyproject_path = "/proj/my-api/pyproject.toml"
index_names = ["priv", "extra"]

# A project-level venv override, distinct from the global Central setting above.
[projects.venv]
kind = "custom"
path = "/mnt/envs/my-api"

# The project-level pin that version 2 moves onto the environment.
[projects.python]
kind = "set"

[projects.python.value]
kind = "version"
value = "3.11"

# A secret var: value must be empty on disk, the real value lives in the keychain.
[[projects.env]]
key = "DATABASE_PASSWORD"
value = ""
secret = true

[[projects.scripts]]
path = "./scripts/decrypt.sh"
args = []
enabled = false

[projects.members]
all_discovered = false

[[projects.members.entries]]
path = "packages/alpha"
origin = "discovered"
selected = true

[[projects.members.entries]]
path = "/work/shared-lib"
origin = "added"
selected = false
name = "shared-lib"

# Per-project overrides. `kind = "inherit"` is the other shape of each, and
# is what an absent field loads as -- which is what keeps a config written
# before these existed loading unchanged.
