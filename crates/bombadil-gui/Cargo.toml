[package]
name = "bombadil-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bombadil-core = { path = "../bombadil-core", version = "0.1.0" }
bombadil-uv-bin = { path = "../bombadil-uv-bin", version = "0.1.0" }
iced = "0.14"
rfd = "0.17"

[dev-dependencies]
uuid.workspace = true
# Enables `bombadil_core::process::FakeCommandRunner` for this crate's own
# tests. Cargo unifies features across [dependencies] and [dev-dependencies]
# for the same path dependency during test builds only, so `test-support`
# never reaches a release build. Not a new dependency -- bombadil-core is
# already depended on above.
bombadil-core = { path = "../bombadil-core", version = "0.1.0", features = ["test-support"] }
