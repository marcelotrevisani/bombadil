[package]
name = "bombadil-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A desktop keeper for uv virtual environments: track, sync and open the environments you already have."
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
bombadil-core = { path = "../bombadil-core", version = "0.3.3" }
bombadil-uv-bin = { path = "../bombadil-uv-bin", version = "0.3.3" }
iced = { version = "0.14", features = ["canvas"] }
rfd = "0.17"
# Already in Cargo.lock via iced; declared here for `Task::stream`, which
# takes a `futures::Stream`. Not a new entry in Cargo.lock.
futures = "0.3"
# Already a workspace dependency (bombadil-core depends on it); promoted from
# dev-dependencies here because `add_project::to_project` builds a throwaway
# `Project`, whose `id` field is a `Uuid`, for display-only calls into
# `venv_path::resolve`. Not a new entry in Cargo.lock.
uuid.workspace = true

[dev-dependencies]
# Already a workspace dependency (bombadil-core depends on it); the terminal
# tests need a scratch directory to hand `run_open_terminal`, which used to
# write its shell re-assertion init file into the real temp dir. Not a new
# entry in Cargo.lock.
tempfile.workspace = true
# Already in Cargo.lock via iced's text stack (cosmic-text -> fontdb); the
# icon test looks each icon's codepoint up in the bundled font with it, so a
# wrong codepoint fails a test instead of rendering a blank box.
ttf-parser = "0.25"
# Enables `bombadil_core::process::FakeCommandRunner` for this crate's own
# tests. Cargo unifies features across [dependencies] and [dev-dependencies]
# for the same path dependency during test builds only, so `test-support`
# never reaches a release build. Not a new dependency -- bombadil-core is
# already depended on above.
bombadil-core = { path = "../bombadil-core", version = "0.3.3", features = ["test-support"] }

# The tray, split by platform on purpose. `ksni` speaks StatusNotifierItem over
# D-Bus in pure Rust, which is the protocol GNOME/KDE actually use and costs
# this build no GTK and no X11 -- `tray-icon`'s default features would add
# both, and every Linux contributor and CI job would then need libgtk-3-dev,
# libxdo-dev and libayatana-appindicator3-dev to compile a GUI that otherwise
# draws every pixel itself.
[target.'cfg(target_os = "linux")'.dependencies]
# `blocking` is only the API shape; a reactor still has to be chosen. `async-io`
# rather than the default `tokio`, so this pulls in no async runtime that the
# rest of the application does not already use.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

# Off Linux there is no such protocol and no lighter option; `tray-icon` has no
# GTK dependency on these platforms.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
