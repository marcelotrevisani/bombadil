<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <rect width="1200" height="340" fill="#1B1D1A"/>

  <!-- The mark, at the same proportions as the application icon. -->
  <g transform="translate(96,42) scale(0.5)">
    <g transform="translate(256,262) scale(1.3) translate(-256,-247)">
      <path d="M330 324 C314 240 344 168 414 120 C402 212 382 280 330 324 Z" fill="#E3B23C"/>
      <path d="M338 318 C333 246 357 186 406 140" fill="none" stroke="#1B1D1A" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
      <path d="M186 324 L200 152 a26 26 0 0 1 26 -24 h60 a26 26 0 0 1 26 24 l14 172 Z" fill="#5E94D6"/>
      <rect x="184" y="288" width="146" height="36" fill="#3A6BA5"/>
      <rect x="96" y="324" width="320" height="44" rx="22" fill="#5E94D6"/>
    </g>
  </g>

  <text x="392" y="164" font-family="Atkinson Hyperlegible Next" font-weight="600" font-size="86" fill="#E8E4D9">Bombadil</text>
  <text x="396" y="212" font-family="Atkinson Hyperlegible Next" font-size="28" fill="#8B9187">A desktop keeper for uv virtual environments</text>

  <!-- The application's whole symbolic vocabulary: present, absent, drifted. -->
  <g transform="translate(398,258)">
    <circle cx="8" cy="0" r="8" fill="#5F9169"/>
    <text x="28" y="7" font-family="IBM Plex Mono" font-size="19" fill="#8B9187">present</text>
    <circle cx="140" cy="0" r="7" fill="none" stroke="#8B9187" stroke-width="2.5"/>
    <text x="160" y="7" font-family="IBM Plex Mono" font-size="19" fill="#8B9187">absent</text>
    <circle cx="262" cy="0" r="7.5" fill="none" stroke="#E3B23C" stroke-width="2.5"/>
    <circle cx="262" cy="0" r="3" fill="#E3B23C"/>
    <text x="284" y="7" font-family="IBM Plex Mono" font-size="19" fill="#8B9187">drifted</text>
  </g>

  <rect x="0" y="336" width="1200" height="4" fill="#3A3E37"/>
</svg>
