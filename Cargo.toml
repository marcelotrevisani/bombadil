[workspace]
resolver = "3"
members = ["crates/bombadil-core", "crates/bombadil-uv-bin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
sha2 = "0.11.0"
directories = "6.0.0"
thiserror = "2.0.19"
tempfile = "3.27.0"
