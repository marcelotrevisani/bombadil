[workspace]
resolver = "3"
members = [
    "crates/bombadil",
    "crates/bombadil-core",
    "crates/bombadil-gui",
    "crates/bombadil-uv-bin",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
# crates.io requires a description and rejects a publish without one; the rest
# is what makes a listing usable rather than a name and a version number.
repository = "https://github.com/marcelotrevisani/bombadil"
homepage = "https://github.com/marcelotrevisani/bombadil"
authors = ["Marcelo Duarte Trevisani"]
keywords = ["uv", "python", "virtualenv", "venv", "gui"]
categories = ["development-tools"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
sha2 = "0.11.0"
directories = "6.0.0"
thiserror = "2.0.19"
tempfile = "3.27.0"
keyring = "4.1.6"
