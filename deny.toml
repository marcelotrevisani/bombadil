# cargo-deny policy. Run locally with `cargo deny check`.
#
# Four things are checked: security advisories, license compatibility,
# duplicate/banned crates, and where crates come from.

[graph]
all-features = true

[advisories]
# Every RustSec advisory is a failure by default. Anything genuinely
# unactionable gets an entry here with a comment explaining why — an empty
# list is the goal, not a formality.
#
# Every entry below is "unmaintained", not a vulnerability, with no safe
# upgrade path today; revisit each when one appears. The first two were
# discovered once bombadil-gui pulled in iced 0.14 and its winit/cosmic-text
# font stack (they postdate the licence-only spike behind the deny.toml change
# in plan 3a task 1).
ignore = [
    # dtolnay's `paste`, archived by its author. Reached via
    # winit -> metal -> wgpu-hal, used only on macOS's Metal backend.
    "RUSTSEC-2024-0436",
    # `ttf-parser`, reached via winit/cosmic-text's font stack
    # (fontdb, owned_ttf_parser). The advisory recommends `skrifa`, which
    # cosmic-text does not yet use.
    "RUSTSEC-2026-0192",
    # `zvariant`, `zbus_names` and `zvariant_derive`, merged into `zbus` 6 as
    # its `wire` and `names` modules. Every crate here that uses D-Bus still
    # requires zbus 5 in its newest release: ksni (tray), notify-rust (desktop
    # notifications), secret-service via the keyring store, and mundy via
    # iced_winit. Drop these once they have all moved to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# This project is Apache-2.0, and plan 2 will redistribute the uv binary
# (Apache-2.0 OR MIT) inside our own executable. Keep the dependency tree
# to licenses compatible with shipping a permissively-licensed binary.
#
# Unicode-3.0 is here because `unicode-ident` is licensed
# "(MIT OR Apache-2.0) AND Unicode-3.0" — the Unicode term is ANDed, not an
# alternative, so it applies no matter which of MIT/Apache-2.0 we take. It
# covers the embedded Unicode character tables, is OSI-approved and
# permissive, and imposes no obligation beyond attribution.
# Reached only through [build-dependencies]: ureq's TLS stack, used by
# build.rs to download the pinned uv release. These crates compile the
# build script; they are not linked into Bombadil and are never
# redistributed. All are permissive with no copyleft obligation, so they
# are compatible with shipping an Apache-2.0 binary.
#
# ISC                  - ring, untrusted, rustls-webpki
# CDLA-Permissive-2.0  - webpki-roots (Mozilla's CA certificate data)
# BSD-3-Clause         - subtle
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "ISC", "CDLA-Permissive-2.0", "BSD-3-Clause", "Zlib", "BSL-1.0", "BSD-2-Clause"]
confidence-threshold = 0.93

# Crates whose license is not in the allow list, permitted deliberately.
exceptions = [
    # hexf-parse is CC0-1.0, reached through iced's font stack. CC0 is a
    # public-domain dedication that explicitly grants no patent rights, which
    # is why it is scoped to this one crate rather than allowed globally.
    { allow = ["CC0-1.0"], crate = "hexf-parse" },
    # Reached via directories -> dirs-sys -> option-ext, so it arrives with
    # the platform config-directory lookup rather than by choice.
    #
    # MPL-2.0 is file-level copyleft: it obliges us to publish modifications
    # to option-ext's own source files. We link it unmodified, so nothing is
    # triggered. Revisit only if we ever vendor and patch it.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # ksni is Unlicense, and is a deliberate choice rather than something a
    # dependency dragged in: it is the Linux tray, chosen over `tray-icon`
    # precisely to keep GTK3 and X11 out of this build (see `gui/src/tray.rs`).
    #
    # Unlicense is a public-domain dedication -- OSI approved and FSF
    # Free/Libre -- with a fallback licence grant for jurisdictions that do not
    # recognise dedication to the public domain. Like CC0 above it grants no
    # patent rights explicitly, which is why it is scoped to this one crate
    # rather than added to the global allow list where it would silently cover
    # every future dependency.
    { allow = ["Unlicense"], crate = "ksni" },
]

[bans]
# Duplicate versions are a warning, not a failure. They are usually forced by
# a transitive dependency we do not control (getrandom 0.2 and 0.4 both appear
# today), so failing the build on them would punish us for someone else's
# release schedule. Worth seeing, not worth blocking.
multiple-versions = "warn"
wildcards = "deny"
# Nothing is banned yet. Add entries here rather than discovering a problem
# crate in review.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
